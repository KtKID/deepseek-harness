# Plugin Doctor snapshot surface: add the installable bundle's model tool to
# the ordinary ACP example without changing the base composition.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: plugin-doctor
            name: '@deepseek-ai/dsh-plugin-doctor'
            config:
              timeoutMs: 120000
